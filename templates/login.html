<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Caddy Server Manager</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <h1>Caddy Server</h1>
            <span>MANAGER</span>
        </div>
        <h2 class="auth-title">登录</h2>
        <p class="auth-subtitle">请输入管理员账号密码</p>

        <form id="loginForm">
            <input type="hidden" id="redirectField" value="{{.redirect}}">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
            </div>
            <div class="form-error" id="loginError" style="margin-bottom: 12px;"></div>
            <button type="submit" class="btn btn-primary btn-lg btn-block" id="submitBtn">登录</button>
        </form>
    </div>
</div>

<script>
(function() {
    var form = document.getElementById('loginForm');
    var submitBtn = document.getElementById('submitBtn');
    var loginError = document.getElementById('loginError');
    var redirectField = document.getElementById('redirectField');

    function showToast(msg, type) {
        var container = document.createElement('div');
        container.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:500;';
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + (type || 'error');
        toast.textContent = msg;
        container.appendChild(toast);
        document.body.appendChild(container);
        setTimeout(function() { container.remove(); }, 3000);
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        loginError.textContent = '';

        var username = form.username.value.trim();
        var password = form.password.value;
        if (!username || !password) {
            loginError.textContent = '请输入用户名和密码';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '登录中...';

        fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.code === 0) {
                localStorage.setItem('auth_token', data.data.token);
                localStorage.setItem('auth_user', data.data.user.username);
                var redirect = redirectField.value || '/';
                window.location.href = redirect;
            } else {
                loginError.textContent = data.message;
                submitBtn.disabled = false;
                submitBtn.textContent = '登录';
            }
        })
        .catch(function() {
            showToast('网络错误，请重试', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = '登录';
        });
    });
})();
</script>
</body>
</html>
